<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="100%" height="100%">
  <defs>
    <!-- Deep Space Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#030407" />
      <stop offset="40%"  stop-color="#090c1e" />
      <stop offset="100%" stop-color="#020309" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#93c5fd" />
      <stop offset="50%"  stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#f9a8d4" />
      <stop offset="50%"  stop-color="#db2777" />
      <stop offset="100%" stop-color="#9d174d" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#fcd34d" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#93c5fd" />
      <stop offset="50%"  stop-color="#818cf8" />
      <stop offset="100%" stop-color="#f9a8d4" />
    </linearGradient>

    <!-- Dot Grid -->
    <pattern id="dotGrid" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#ffffff" opacity="0.08"/>
    </pattern>

    <!-- Glow Filters -->
    <filter id="glowBlue"    x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"  result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowPink"    x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"  result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowEmerald" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"  result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowAmber"   x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"  result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow"    x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"  result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    @keyframes flowing-dash   { to { stroke-dashoffset: -44; } }
    @keyframes flowing-dash-r { to { stroke-dashoffset:  44; } }
    @keyframes pulse-node     { 0%,100%{ transform: scale(1); opacity:.92; }  50%{ transform: scale(1.04); opacity:1; } }
    @keyframes glow-pulse     { 0%,100%{ opacity:.3; } 50%{ opacity:.9; } }
    @keyframes float-card     { 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-7px); } }
    @keyframes badge-pop      { 0%,100%{ transform: scale(1);    } 50%{ transform: scale(1.07); } }

    .canvas-bg    { fill: url(#bgGrad); }
    .grid-overlay { fill: url(#dotGrid); }

    .path-mysql    { stroke: #3b82f6; stroke-dasharray: 9 7; animation: flowing-dash   1.15s linear infinite; }
    .path-fallback { stroke: #db2777; stroke-dasharray: 9 7; animation: flowing-dash   1.65s linear infinite; }
    .path-error    { stroke: #f43f5e; stroke-dasharray: 5 9; animation: flowing-dash-r  .9s linear infinite; }

    .node-pulsing  { transform-origin: center; animation: pulse-node 3s infinite ease-in-out; }
    .glow-pulsing  { animation: glow-pulse 2.2s infinite ease-in-out; }
    .card-float    { animation: float-card 6s   ease-in-out infinite; transform-origin: center; }
    .badge-pop     { animation: badge-pop  2.6s ease-in-out infinite; }

    .t-title  { font-family:'Space Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; font-weight:700; font-size:20px; letter-spacing:3px; }
    .t-sub    { font-family:'Outfit',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; font-size:11px; fill:#94a3b8; letter-spacing:1.6px; }
    .t-bold   { font-family:'Space Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; font-weight:700; font-size:14px; fill:#f8fafc; }
    .t-tag    { font-family:'Outfit',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; font-weight:600; font-size:10px; letter-spacing:2px; }
    .t-code   { font-family:'Consolas','Courier New',monospace; font-size:10.5px; fill:#cbd5e1; }
    .t-mono   { font-family:'Consolas','Courier New',monospace; font-size:8.5px; fill:#64748b; }
  </style>

  <!-- Background -->
  <rect width="900" height="460" rx="22" class="canvas-bg" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
  <rect width="900" height="460" rx="22" class="grid-overlay" pointer-events="none"/>

  <!-- Ambient Halos -->
  <circle cx="170" cy="280" r="160" fill="#3b82f6" opacity="0.04" filter="url(#glowBlue)"/>
  <circle cx="730" cy="280" r="160" fill="#db2777" opacity="0.04" filter="url(#glowPink)"/>
  <circle cx="450" cy="120" r="100" fill="#818cf8" opacity="0.04" filter="url(#softGlow)"/>

  <!-- ═══════════════════════════════════════════════════════
       HEADER
  ═══════════════════════════════════════════════════════ -->
  <text x="450" y="44" text-anchor="middle" class="t-title" fill="url(#headerGrad)">DYNAMIC  MULTI-DIALECT  RESILIENCE</text>
  <text x="450" y="64" text-anchor="middle" class="t-sub">SEQUELIZE  ORM  AUTO-FALLBACK  ROUTING  PIPELINE  ·  MYSQL  ↔  SQLITE</text>
  <line x1="90" y1="76" x2="395" y2="76" stroke="url(#blueGrad)"  stroke-width="1.2" opacity="0.25"/>
  <line x1="505" y1="76" x2="810" y2="76" stroke="url(#pinkGrad)" stroke-width="1.2" opacity="0.25"/>

  <!-- ═══════════════════════════════════════════════════════
       INITIALIZER CARD  (Center Top)
  ═══════════════════════════════════════════════════════ -->
  <g transform="translate(323, 100)">
    <g class="node-pulsing">
      <rect width="254" height="84" rx="16" fill="rgba(8,10,28,0.92)" stroke="rgba(255,255,255,0.10)" stroke-width="1.5"/>
      <!-- Top gradient bar -->
      <rect x="0" y="0" width="254" height="5" rx="3" fill="url(#headerGrad)"/>
      <!-- Status dot -->
      <circle cx="22" cy="34" r="5.5" fill="#34d399" filter="url(#glowEmerald)" class="glow-pulsing"/>
      <text x="38" y="37" class="t-tag"  fill="#94a3b8">DATABASE  BOOT  CHECK</text>
      <text x="18" y="60" class="t-bold" fill="#f8fafc">database.ts  ORM  Core</text>
      <text x="18" y="74" class="t-mono">Sequelize v6  ·  MySQL2  driver  ·  SQLite3</text>
    </g>
  </g>

  <!-- ═══════════════════════════════════════════════════════
       ROUTING PATH LINES
  ═══════════════════════════════════════════════════════ -->
  <!-- → MySQL  -->
  <path d="M 323 142 L 160 142 L 160 220" fill="none" class="path-mysql"    stroke-width="2.2"/>
  <!-- → SQLite -->
  <path d="M 577 142 L 740 142 L 740 220" fill="none" class="path-fallback" stroke-width="2.2"/>
  <!-- Error redirect route (MySQL fail → SQLite) -->
  <path d="M 160 330 C 160 390, 740 390, 740 330" fill="none" class="path-error" stroke-width="1.6" opacity="0.55"/>

  <!-- Animated traveling particles: MySQL route -->
  <circle r="5.5" fill="#3b82f6" filter="url(#glowBlue)">
    <animateMotion dur="2.6s" repeatCount="indefinite" path="M 323 142 L 160 142 L 160 220"/>
  </circle>
  <circle r="4" fill="#60a5fa" filter="url(#glowBlue)">
    <animateMotion dur="2.6s" repeatCount="indefinite" path="M 323 142 L 160 142 L 160 220" begin="1.3s"/>
  </circle>

  <!-- Animated traveling particles: SQLite route -->
  <circle r="5.5" fill="#db2777" filter="url(#glowPink)">
    <animateMotion dur="3.0s" repeatCount="indefinite" path="M 577 142 L 740 142 L 740 220"/>
  </circle>
  <circle r="4" fill="#f472b6" filter="url(#glowPink)">
    <animateMotion dur="3.0s" repeatCount="indefinite" path="M 577 142 L 740 142 L 740 220" begin="1.5s"/>
  </circle>

  <!-- Animated error reroute particle -->
  <circle r="4.5" fill="#f43f5e">
    <animate attributeName="opacity" values="0;1;1;0" dur="4s" repeatCount="indefinite"/>
    <animateMotion dur="4s" repeatCount="indefinite" path="M 160 330 C 160 390, 740 390, 740 330" begin="0s"/>
  </circle>

  <!-- ═══════════════════════════════════════════════════════
       MYSQL NODE  (Left)
  ═══════════════════════════════════════════════════════ -->
  <g transform="translate(20, 220)">
    <g class="card-float">
      <rect width="280" height="140" rx="18" fill="rgba(9,12,28,0.92)" stroke="url(#blueGrad)" stroke-width="1.8"/>
      <!-- Top bar -->
      <rect x="0" y="0" width="280" height="5" rx="3" fill="url(#blueGrad)" opacity="0.7"/>
      <!-- Banner row -->
      <rect x="12" y="14" width="256" height="26" rx="10" fill="rgba(59,130,246,0.12)"/>
      <circle cx="28" cy="27" r="5" fill="#60a5fa" class="glow-pulsing"/>
      <text x="42" y="31" class="t-tag" fill="#93c5fd">🐬  MYSQL  DIALECT  (PRIMARY)</text>
      <!-- Card content -->
      <text x="18" y="64" class="t-bold">Production / Staging</text>
      <text x="18" y="82" class="t-sub">• DB_NAME, DB_USER, DB_HOST (env)</text>
      <text x="18" y="97" class="t-sub">• Pool: max 10 · idle 10s · acquire 30s</text>
      <text x="18" y="112" class="t-sub">• Collation: utf8mb4_unicode_ci</text>
      <!-- Status indicator -->
      <rect x="12" y="122" width="256" height="4" rx="2" fill="rgba(255,255,255,0.05)"/>
      <rect x="12" y="122" width="200" height="4" rx="2" fill="url(#blueGrad)">
        <animate attributeName="width" values="100;220;100" dur="5s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- ═══════════════════════════════════════════════════════
       SQLITE FALLBACK NODE  (Right)
  ═══════════════════════════════════════════════════════ -->
  <g transform="translate(600, 220)">
    <g class="card-float" style="animation-delay:3s">
      <rect width="280" height="140" rx="18" fill="rgba(9,12,28,0.92)" stroke="url(#pinkGrad)" stroke-width="1.8"/>
      <rect x="0" y="0" width="280" height="5" rx="3" fill="url(#pinkGrad)" opacity="0.7"/>
      <rect x="12" y="14" width="256" height="26" rx="10" fill="rgba(219,39,119,0.12)"/>
      <circle cx="28" cy="27" r="5" fill="#f472b6" class="glow-pulsing"/>
      <text x="42" y="31" class="t-tag" fill="#fbcfe8">🗃️  SQLITE  AUTO-FALLBACK</text>
      <text x="18" y="64" class="t-bold">Zero-Config Local Dev</text>
      <text x="18" y="82" class="t-sub">• Trigger: missing / refused MySQL conn</text>
      <text x="18" y="97" class="t-sub">• Storage: backend/database.sqlite</text>
      <text x="18" y="112" class="t-sub">• Auto-creates file on first boot</text>
      <rect x="12" y="122" width="256" height="4" rx="2" fill="rgba(255,255,255,0.05)"/>
      <rect x="12" y="122" width="160" height="4" rx="2" fill="url(#pinkGrad)">
        <animate attributeName="width" values="60;200;60" dur="5.5s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- ═══════════════════════════════════════════════════════
       MIDDLE BRIDGE — Error/Fallback Label
  ═══════════════════════════════════════════════════════ -->
  <g transform="translate(326, 385)">
    <rect width="248" height="32" rx="12" fill="rgba(244,63,94,0.08)" stroke="rgba(244,63,94,0.3)" stroke-width="1.2"/>
    <text x="124" y="21" text-anchor="middle" class="t-tag" fill="#f43f5e">↳  CONNECTION  REFUSED  →  REROUTE</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════
       ENV SNIPPET BOX  (Center Bottom)
  ═══════════════════════════════════════════════════════ -->
  <g transform="translate(303, 230)">
    <rect width="294" height="90" rx="14" fill="rgba(2,3,10,0.90)" stroke="rgba(255,255,255,0.07)" stroke-width="1.3"/>
    <rect x="0" y="0" width="294" height="4" rx="2" fill="url(#emeraldGrad)" opacity="0.5"/>
    <text x="14" y="22" class="t-tag"  fill="#64748b">.env  CONFIG  RESOLVER</text>
    <text x="14" y="41" class="t-code" fill="#a5b4fc">DB_DIALECT=mysql</text>
    <text x="14" y="56" class="t-code" fill="#818cf8">DB_FALLBACK_TO_SQLITE=true</text>
    <text x="14" y="71" class="t-code" fill="#6366f1">DB_HOST=127.0.0.1  :  3306</text>
    <text x="14" y="84" class="t-mono">↑ loaded silently via loadDotenvSilently()</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════
       STATUS BADGE  (Bottom Center)
  ═══════════════════════════════════════════════════════ -->
  <g transform="translate(328, 425)">
    <g class="badge-pop">
      <rect width="244" height="24" rx="12" fill="rgba(16,185,129,0.09)" stroke="#34d399" stroke-width="1.4" filter="url(#glowEmerald)"/>
      <circle cx="18" cy="12" r="4" fill="#34d399" class="glow-pulsing"/>
      <text x="32" y="16" font-family="Space Grotesk" font-weight="700" font-size="10" fill="#34d399" letter-spacing="1.6">ROUTING  SANITY  CHECK:  PASS ✓</text>
    </g>
  </g>
</svg>
